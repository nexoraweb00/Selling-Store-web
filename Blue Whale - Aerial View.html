<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Whale - Aerial View</title>
<style>
html,body{height:100%;margin:0;background:#000;overflow:hidden;
background: transparent !important; 
  padding: 0;
  overflow: hidden;
}
body{background:radial-gradient(ellipse at 50% 50%,#031a33 0%,#000 75%)}
canvas{position:fixed;inset:0;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,D;
function rs(){D=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';}
window.addEventListener('resize',rs);rs();
var N=48,CL='#3aa9ff',dots=[],pl=[],rip=[],lastR=0,i;
for(i=0;i<90;i++)dots.push({s:.06+Math.random()*.74,v:Math.random()*1.7-.85,r:.6+Math.random()*1.3});
for(i=0;i<45;i++)pl.push({x:Math.random(),y:Math.random(),k:Math.random()*6});
function wf(s){var f=s<.38?Math.pow(Math.sin(1.5708*s/.38),.6):Math.pow((.88-s)/.5,1.4);return Math.max(.14,f)*.098;}
function frame(ms){
  var RM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var t=ms/1000*(RM?.5:1);
  x.setTransform(D,0,0,D,0,0);x.clearRect(0,0,W,H);
  var dg=Math.sqrt(W*W+H*H),L=Math.min(dg*.66,1300),span=dg+L*1.2,dr=Math.atan2(H,-W),ux=Math.cos(dr),uy=Math.sin(dr);
  var u=((t*L*.11)%span)-L*.6,sw=Math.sin(t*.3)*Math.min(W,H)*.05,px=W+ux*u-uy*sw,py=uy*u+ux*sw,ang=dr+Math.cos(t*.3)*.05;
  var fade=Math.min(1,t/1.5);
  /* plankton */
  x.shadowBlur=0;x.fillStyle=CL;
  for(i=0;i<pl.length;i++){var q=pl[i];x.globalAlpha=(.1+.15*Math.sin(t+q.k))*fade;
    x.beginPath();x.arc(q.x*W+Math.sin(t*.2+q.k)*18,q.y*H+Math.cos(t*.17+q.k)*14,1.4,0,6.283);x.fill();}
  /* ripples */
  if(t-lastR>1.2){lastR=t;rip.push({x:px-Math.cos(ang)*L*.42,y:py-Math.sin(ang)*L*.42,a:0});}
  x.strokeStyle=CL;x.lineWidth=1;
  for(i=rip.length-1;i>=0;i--){var r=rip[i];r.a+=.016*(RM?.5:1);
    if(r.a>4){rip.splice(i,1);continue;}
    x.globalAlpha=(1-r.a/4)*.22*fade;x.beginPath();x.arc(r.x,r.y,r.a*L*.11,0,6.283);x.stroke();}
  /* whale */
  x.save();x.translate(px,py);x.rotate(ang);
  x.globalAlpha=fade;x.shadowColor='#0a62ff';x.shadowBlur=14;
  x.strokeStyle=CL;x.fillStyle=CL;x.lineWidth=Math.max(1.4,L*.003);x.lineJoin='round';x.lineCap='round';
  var ph=t*2.2,Px=[],Py=[],Tx=[],Ty=[],Nx=[],Ny=[],Wd=[],s,k,a,b,m;
  for(i=0;i<=N;i++){s=i/N*.88;Px[i]=L*(.5-s);Py[i]=L*.05*(.08+1.7*s*s)*Math.sin(ph-7*s);Wd[i]=wf(s)*L;}
  for(i=0;i<=N;i++){a=Math.max(i-1,0);b=Math.min(i+1,N);
    var dx=Px[b]-Px[a],dy=Py[b]-Py[a];m=Math.sqrt(dx*dx+dy*dy)||1;
    Tx[i]=dx/m;Ty[i]=dy/m;Nx[i]=-Ty[i];Ny[i]=Tx[i];}
  function side(f,sg,from,to){x.beginPath();for(var j=from;j<=to;j++){var X=Px[j]+Nx[j]*Wd[j]*f*sg,Y=Py[j]+Ny[j]*Wd[j]*f*sg;j==from?x.moveTo(X,Y):x.lineTo(X,Y);}x.stroke();}
  /* body outline */
  x.beginPath();
  for(i=0;i<=N;i++)i?x.lineTo(Px[i]+Nx[i]*Wd[i],Py[i]+Ny[i]*Wd[i]):x.moveTo(Px[i]+Nx[i]*Wd[i],Py[i]+Ny[i]*Wd[i]);
  for(i=N;i>=0;i--)x.lineTo(Px[i]-Nx[i]*Wd[i],Py[i]-Ny[i]*Wd[i]);
  x.closePath();x.stroke();
  /* inner contours */
  x.globalAlpha=.3*fade;x.lineWidth=Math.max(1,L*.0018);
  side(.55,1,2,N-4);side(.55,-1,2,N-4);
  x.globalAlpha=.45*fade;side(.82,1,1,15);side(.82,-1,1,15);
  /* spine + rostrum ridge */
  x.globalAlpha=.55*fade;side(0,1,0,17);
  x.globalAlpha=.25*fade;side(0,1,17,N-3);
  /* blowholes, dorsal fin, eyes */
  x.globalAlpha=.8*fade;x.lineWidth=Math.max(1.2,L*.0025);
  k=15;for(var sg=-1;sg<=1;sg+=2){x.beginPath();
    x.moveTo(Px[k]+Nx[k]*L*.012*sg,Py[k]+Ny[k]*L*.012*sg);
    x.lineTo(Px[k+1]+Nx[k+1]*L*.008*sg,Py[k+1]+Ny[k+1]*L*.008*sg);x.stroke();
    var e=11;x.beginPath();x.arc(Px[e]+Nx[e]*Wd[e]*.97*sg,Py[e]+Ny[e]*Wd[e]*.97*sg,L*.004,0,6.283);x.stroke();}
  k=38;x.beginPath();x.moveTo(Px[k]+Nx[k]*L*.007,Py[k]+Ny[k]*L*.007);
  x.lineTo(Px[k]+Tx[k]*L*.032,Py[k]+Ty[k]*L*.032);x.lineTo(Px[k]-Nx[k]*L*.007,Py[k]-Ny[k]*L*.007);x.stroke();
  /* mottling */
  x.globalAlpha=.4*fade;x.shadowBlur=6;
  for(i=0;i<dots.length;i++){var d=dots[i];k=Math.round(d.s/.88*N);
    x.beginPath();x.arc(Px[k]+Nx[k]*Wd[k]*d.v,Py[k]+Ny[k]*Wd[k]*d.v,d.r*L*.0016+.4,0,6.283);x.fill();}
  x.shadowBlur=14;x.globalAlpha=fade;x.lineWidth=Math.max(1.4,L*.003);
  /* flippers */
  k=19;for(sg=-1;sg<=1;sg+=2){
    var fa=.8+.18*Math.sin(ph*.5+sg),nx=sg*Nx[k],ny=sg*Ny[k];
    var Dx=nx*Math.cos(fa)+Tx[k]*Math.sin(fa),Dy=ny*Math.cos(fa)+Ty[k]*Math.sin(fa);
    var Bx=Px[k]+nx*Wd[k]*.88,By=Py[k]+ny*Wd[k]*.88;
    x.beginPath();x.moveTo(Bx-Tx[k]*L*.02,By-Ty[k]*L*.02);
    x.quadraticCurveTo(Bx+Dx*L*.11-Tx[k]*L*.03,By+Dy*L*.11-Ty[k]*L*.03,Bx+Dx*L*.21,By+Dy*L*.21);
    x.quadraticCurveTo(Bx+Dx*L*.11+Tx[k]*L*.045,By+Dy*L*.11+Ty[k]*L*.045,Bx+Tx[k]*L*.06,By+Ty[k]*L*.06);
    x.stroke();}
  /* flukes */
  var ex=Px[N],ey=Py[N];
  function pt(p,q){return[ex+Tx[N]*p*L+Nx[N]*q*L,ey+Ty[N]*p*L+Ny[N]*q*L];}
  var p0=pt(0,0),tl=pt(.095,.165),nt=pt(.05,0),tr=pt(.095,-.165),c1=pt(.025,.05),c2=pt(.075,.12),c3=pt(.085,.08),c4=pt(.085,-.08),c5=pt(.075,-.12),c6=pt(.025,-.05);
  x.beginPath();x.moveTo(p0[0],p0[1]);
  x.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],tl[0],tl[1]);
  x.quadraticCurveTo(c3[0],c3[1],nt[0],nt[1]);
  x.quadraticCurveTo(c4[0],c4[1],tr[0],tr[1]);
  x.bezierCurveTo(c5[0],c5[1],c6[0],c6[1],p0[0],p0[1]);
  x.stroke();
  x.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
