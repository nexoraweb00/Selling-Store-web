<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Vacation Selling.webstore</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="logo">Vacation Selling</div>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
    <nav class="nav" id="mainNav">
      <a href="index.html">Home</a>
      <a href="cart.html" class="cart-link">Cart 🛒 <span class="cart-count">0</span></a>
    </nav>
  </header>

  <div class="auth-wrap">
    <h2 id="formTitle">Login</h2>
    <form id="authForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" required />
      </div>
      <div class="form-group" id="emailGroup" style="display:none">
        <label>Email</label>
        <input type="email" id="email" />
      </div>
      <div class="form-group" id="phoneGroup" style="display:none">
        <label>Mobile Number</label>
        <input type="text" id="phone" placeholder="07X XXX XXXX" />
      </div>
      <div class="form-group" id="addressGroup" style="display:none">
        <label>Delivery Address</label>
        <textarea id="address" rows="2" placeholder="Your full address" style="width:100%; padding:12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; margin-bottom: 15px; font-family: inherit;"></textarea>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn btn-block" id="submitBtn">Login</button>
    </form>
    <div style="text-align: center; margin-top: 20px;">
      <div style="position: relative; text-align: center; margin-bottom: 15px;">
        <hr style="border: 0; border-top: 1px solid #ddd;">
        <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: white; padding: 0 10px; color: #888; font-size: 14px;">OR</span>
      </div>
      <button type="button" onclick="googleLogin()" class="btn" style="background-color: white; color: #333; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px;">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20" />
        Sign in with Google
      </button>
    </div>

    <div class="auth-switch">
      <span id="switchText">Don't have an account?</span>
      <a href="#" id="switchLink">Register</a>
    </div>
  </div>
    </form>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
