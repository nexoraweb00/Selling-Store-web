<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offer Details — Vacation Selling</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="logo">Vacation Selling</div>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
    <nav class="nav" id="mainNav">
      <a href="index.html">Home</a>
      <a href="cart.html" class="cart-link">Cart 🛒 <span class="cart-count">0</span></a>
      <span id="userArea"></span>
    </nav>
  </header>

  <div class="container">
    <div id="activeOfferBanner" style="display: none; margin-bottom: 20px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative;">
      <img id="offerBannerImg" src="" style="width: 100%; max-height: 250px; object-fit: cover;" />
      <div style="position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.8)); padding: 20px;">
        <h1 id="offerBannerTitle" style="color: white; margin: 0; font-size: 28px;"></h1>
      </div>
    </div>

    <div class="header-row">
      <h2 class="section-title" style="color: #ffffff; margin-bottom: 0;">Offer Items</h2>
      <div class="search-bar-inline">
        <input type="text" id="searchInput" placeholder="🔍 Search in this offer..." />
      </div>
    </div>

    <div class="product-grid" id="productGrid" style="margin-top: 20px;"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="icon">🔍</div>
      <p style="color: white;">No items found for this offer</p>
    </div>
  </div>

  <script type="module" src="js/offer.js"></script>
</body>
</html>
